# Canary: OTRO Deployment (1 réplica v2) al lado de shop-web.
# Selector distinto para que el ReplicaSet de shop-web no se lo quede.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web-canary
  namespace: shop
  labels:
    app: shop-web-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop-web-canary
  template:
    metadata:
      labels:
        app: shop-web-canary
        version: v2
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0.0
          args:
            - "-text=shop-web v2-canary"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
